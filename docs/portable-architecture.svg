 <title id="portable-title">Portable execution architecture</title>
 <desc id="portable-desc">Application policy and approval feed a validated graph and scheduler, then Python or Rust process adapters invoke an executable, coding tool or model. Historical benchmarks and persistence or transport remain separate subsystems; optional integration is dashed.</desc>
