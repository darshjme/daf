[workspace]
resolver = "2"
members = [
    "crates/daf-core",
    "crates/daf-ddal",
    "crates/daf-orchestrator",
    "crates/daf-provision",
    "crates/daf-configure",
    "crates/daf-logger",
    "crates/daf-memory",
    "crates/daf-cli",
    "crates/daf-sdk",
    "crates/daf-registry",
    "crates/daf-transport",
    "crates/daf-graph",
    "crates/daf-vault",
    "crates/daf-runtime",
    "benchmarks",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/darshjme/daf"
homepage = "https://daf.darshj.ai"
documentation = "https://docs.daf.darshj.ai"
authors = ["Darshankumar Joshi <darsh@darshj.ai>"]
description = "Darshj's Agent Framework — A unified infrastructure for orchestrating AI agents with binary socket-based DDAL communication"
keywords = ["agents", "orchestration", "infrastructure", "ddal", "ai"]
categories = ["command-line-utilities", "network-programming", "concurrency"]

[workspace.dependencies]
# Core
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
bytes = "1.10"
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"

# Networking
tokio-util = { version = "0.7", features = ["codec", "rt"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"

# Serialization / Protocol
bincode = "1.3"
rmp-serde = "1.3"
flatbuffers = "25.2"
serde_yaml_ng = "0.10"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
comfy-table = "7.1"

# Storage & State
rocksdb = "0.22"
sled = "0.34"

# Graph
petgraph = "0.7"

# Crypto
blake3 = "1.6"
futures = "0.3"
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }

# HTTP (for registry)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = "0.8"
tower = "0.5"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
