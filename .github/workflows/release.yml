name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p daf-cli
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/daf dist/daf-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: daf-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p daf-core
          sleep 30
          cargo publish -p daf-ddal
          sleep 30
          cargo publish -p daf-memory
          sleep 30
          cargo publish -p daf-graph
          sleep 30
          cargo publish -p daf-logger
          sleep 30
          cargo publish -p daf-registry
          sleep 30
          cargo publish -p daf-transport
          sleep 30
          cargo publish -p daf-vault
          sleep 30
          cargo publish -p daf-orchestrator
          sleep 30
          cargo publish -p daf-provision
          sleep 30
          cargo publish -p daf-configure
          sleep 30
          cargo publish -p daf-runtime
          sleep 30
          cargo publish -p daf-sdk
          sleep 30
          cargo publish -p daf-cli
