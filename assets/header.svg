<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">DAF — graphs, communication and memory for agents</title>
  <desc id="desc">A cyan and magenta task graph branches from a plan through two tasks to a result. Applications provide handlers and policies. Decorative motion stops when reduced motion is requested.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100b23"/><stop offset=".5" stop-color="#080b19"/><stop offset="1" stop-color="#170b29"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#00f5ff"/><stop offset=".52" stop-color="#9874ff"/><stop offset="1" stop-color="#ff46ce"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#933bcb" stop-opacity=".24"/><stop offset="1" stop-color="#933bcb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9b78db" stroke-opacity=".075"/></pattern>
    <clipPath id="frame"><path d="M22 1H1258L1279 22V458L1258 479H22L1 458V22Z"/></clipPath>
  </defs>
  <style>
    .signal { stroke-dasharray: 8 22; animation: signal 9s linear infinite; }
    .breathe { animation: breathe 6s ease-in-out infinite; }
    .orbit { transform-origin: 1010px 240px; animation: orbit 36s linear infinite; }
    @keyframes signal { to { stroke-dashoffset: -180; } }
    @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .signal,.breathe,.orbit { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <ellipse cx="1020" cy="240" rx="330" ry="300" fill="url(#aura)"/>
    <path d="M0 402H700L733 369V99L768 64H1280" stroke="#2e264b" fill="none"/>
    <path d="M0 408H708L741 375V105L776 72H1280" stroke="url(#neon)" stroke-opacity=".23" fill="none"/>
    <g font-family="system-ui, -apple-system, sans-serif">
      <path d="M50 49h26l8 8h-26Z" fill="#00f5ff"/>
      <text x="100" y="60" fill="#b8b5cf" font-family="monospace" font-size="15" letter-spacing="2">DARSHJ’S AGENT FRAMEWORK // RUST</text>
      <text x="49" y="206" fill="#ff46ce" opacity=".16" font-weight="800" font-size="86" letter-spacing="-3">DAF</text>
      <text x="52" y="203" fill="#f5efff" font-weight="800" font-size="86" letter-spacing="-3">DAF</text>
      <text x="53" y="267" fill="#8cfbff" font-weight="600" font-size="29">Graphs. Communication. Memory.</text>
      <path d="M53 300H310L321 289H411" stroke="url(#neon)" stroke-width="2" fill="none"/>
      <text x="53" y="343" fill="#b8b5cf" font-size="20">Explicit execution. Bounded work. Inspectable results.</text>
      <g font-family="monospace" font-size="13" letter-spacing="1.3"><path d="M53 420H145L153 428V454H53Z" fill="#65f8ff" fill-opacity=".055" stroke="#65f8ff" stroke-opacity=".4"/><text x="71" y="443" fill="#65f8ff">RUST</text><path d="M169 420H261L269 428V454H169Z" fill="#c9a9ff" fill-opacity=".055" stroke="#c9a9ff" stroke-opacity=".4"/><text x="187" y="443" fill="#c9a9ff">DDAL</text><path d="M285 420H497L505 428V454H285Z" fill="#ff88de" fill-opacity=".055" stroke="#ff88de" stroke-opacity=".4"/><text x="303" y="443" fill="#ff88de">EARLY DEVELOPMENT</text></g>
    </g>
    <g fill="none">
      <circle class="orbit" cx="1010" cy="240" r="157" stroke="#9874ff" stroke-opacity=".35" stroke-dasharray="50 27 3 27"/>
      <path d="M867 240H910V156H951M867 240H910V324H951M1069 156H1110V240H1151M1069 324H1110V240H1151" stroke="#55466f" stroke-width="2"/>
      <path class="signal" d="M867 240H910V156H951M867 240H910V324H951M1069 156H1110V240H1151M1069 324H1110V240H1151" stroke="url(#neon)" stroke-width="3"/>
      <path d="M773 216H855L867 228V264H773Z" fill="#0c1225" stroke="#00f5ff"/>
      <path d="M951 132H1057L1069 144V180H951Z" fill="#0c1225" stroke="#9874ff"/>
      <path d="M951 300H1057L1069 312V348H951Z" fill="#0c1225" stroke="#ff46ce"/>
      <path d="M1151 216H1233L1245 228V264H1151Z" fill="#0c1225" stroke="#00f5ff"/>
    </g>
    <g font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="1.5">
      <text x="820" y="245" fill="#8cfbff">PLAN</text>
      <text x="1010" y="161" fill="#d4bbff">TASK A</text>
      <text x="1010" y="329" fill="#ff9ee5">TASK B</text>
      <text x="1198" y="245" fill="#8cfbff">RESULT</text>
      <text x="1010" y="437" fill="#b8b5cf" font-size="11" letter-spacing="2">DEPENDENCIES / HANDLERS / EVIDENCE</text>
    </g>
    <g class="breathe" fill="#00f5ff"><circle cx="910" cy="240" r="4"/><circle cx="1110" cy="240" r="4"/></g>
  </g>
  <path d="M22 1H1258L1279 22V458L1258 479H22L1 458V22Z" stroke="url(#neon)" stroke-opacity=".55" fill="none"/>
  <path d="M1 85V22L22 1H91M1189 479H1258L1279 458V395" stroke="#00f5ff" stroke-width="3" fill="none"/>
  <path d="M1190 1H1258L1279 22V69M1 411V458L22 479H91" stroke="#ff46ce" stroke-width="3" fill="none"/>
</svg>
